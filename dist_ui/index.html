<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>玄机阁·术数排盘</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header>
        <a class="github-link" href="https://github.com/yimengjiuan/Mystic-Arcana" target="_blank" rel="noopener" title="GitHub">
            <svg fill="currentColor" viewBox="0 0 24 24" width="22" height="22" xmlns="http://www.w3.org/2000/svg"><path d="M12 0c6.63 0 12 5.276 12 11.79-.001 5.067-3.29 9.567-8.175 11.187-.6.118-.825-.25-.825-.56 0-.398.015-1.665.015-3.242 0-1.105-.375-1.813-.81-2.181 2.67-.295 5.475-1.297 5.475-5.822 0-1.297-.465-2.344-1.23-3.169.12-.295.54-1.503-.12-3.125 0 0-1.005-.324-3.3 1.209a11.32 11.32 0 00-3-.398c-1.02 0-2.04.133-3 .398-2.295-1.518-3.3-1.209-3.3-1.209-.66 1.622-.24 2.83-.12 3.125-.765.825-1.23 1.887-1.23 3.169 0 4.51 2.79 5.527 5.46 5.822-.345.294-.66.81-.765 1.577-.69.31-2.415.81-3.495-.973-.225-.354-.9-1.223-1.845-1.209-1.005.015-.405.56.015.781.51.28 1.095 1.327 1.23 1.666.24.663 1.02 1.93 4.035 1.385 0 .988.015 1.916.015 2.196 0 .31-.225.664-.825.56C3.303 21.374-.003 16.867 0 11.791 0 5.276 5.37 0 12 0z"></path></svg>
        </a>
        <h1>玄 机 阁</h1>
        <div class="subtitle">五起卦·六面板·综合分析</div>
    </header>
    <main>
        <section class="form-section">
            <h2>起卦参数</h2>
            <div class="form-grid">
                <label>年<input id="year" type="number" value="2000"></label>
                <label>月<input id="month" type="number" value="1" min="1" max="12"></label>
                <label>日<input id="day" type="number" value="1" min="1" max="31"></label>
                <label>时<input id="hour" type="number" value="12" min="0" max="23"></label>
                <label>秒<input id="second" type="number" value="0" min="0" max="59"></label>
                <label>起卦方式<select id="method">
                        <option value="time">时间起卦</option>
                        <option value="number">数字起卦</option>
                        <option value="meihua">梅花易数</option>
                        <option value="zaobi">蓍草占卜</option>
                        <option value="cuanke">铜钱摇卦</option>
                    </select></label>
                <label>数字/铜钱<input id="nums" type="text" placeholder="如5,10"></label>
            </div>
            <label class="full-label">起卦依据<select id="basis">
                    <option value="time" selected>仅时间</option>
                    <option value="time_bazi">时间+八字</option>
                    <option value="bazi">仅八字</option>
                </select></label>
            <div id="birth-block" class="form-grid" style="display:none;margin-top:14px">
                <label>生辰年<input id="byear" type="number" value="1990"></label>
                <label>生辰月<input id="bmonth" type="number" value="1" min="1" max="12"></label>
                <label>生辰日<input id="bday" type="number" value="1" min="1" max="31"></label>
                <label>生辰时<input id="bhour" type="number" value="12" min="0" max="23"></label>
                <label>生辰秒<input id="bsecond" type="number" value="0" min="0" max="59"></label>
                <label>性别<select id="gender">
                        <option>男</option>
                        <option>女</option>
                    </select></label>
            </div>
            <label class="full-label">所问之事<textarea id="question" rows="2" placeholder="请输入您想问的问题"></textarea></label>
            <label class="full-label">DeepSeek Key<input id="apikey" type="password" placeholder="sk-..."></label>
            <button id="run-btn">排 盘</button>
        </section>
        <div id="output"></div>
        <section class="compare-section" id="compare-section" style="display:none">
            <h2>横向比对</h2>
            <div class="compare-tabs" id="compare-tabs"></div>
            <div class="compare-table-wrap"><table class="compare-table" id="compare-table"></table></div>
        </section>
    </main>
    <footer>
        <p>玄机阁·仅供文化研究与术数学习参考</p>
        <p class="opensource-notice">本项目<a href="https://github.com/yimengjiuan/Mystic-Arcana" target="_blank" rel="noopener">开源免费</a>·禁止商业倒卖</p>
    </footer>
    <script type="module" src="./ui/main.js"></script>
</body>

</html>
