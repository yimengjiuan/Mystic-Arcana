name: 💡 功能建议
description: 新起卦方式、新面板、UI 改进、算法增强等想法
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法！本项目采用 Issue 单向贡献流程：维护者评估后会自行实现，**无需提交 PR**。
        请尽量说明需求动机与术数依据，便于维护者判断是否采纳。

  - type: textarea
    id: proposal
    attributes:
      label: 建议内容
      description: 你希望新增或改进什么？
      placeholder: 例如：新增「奇门遁甲」排盘面板。
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 动机 / 使用场景
      description: 这个功能解决了什么问题？在什么场景下会用到？
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 术数依据
      description: 若涉及术数算法，请附古法出处或参考资料。
      placeholder: 例如：《奇门遁甲秘笈大全》/ 某排盘软件对照

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他实现方式？可选。
